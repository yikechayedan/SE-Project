version: '3.8'

services:
  # PostgreSQL 数据库
  db:
    image: postgres:15-alpine
    container_name: polymetric-db
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-polymetric}
      POSTGRES_USER: ${DB_USER:-polymetric_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-polymetric_pass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - polymetric-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-polymetric_user} -d ${DB_NAME:-polymetric}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis 缓存和 Celery broker
  redis:
    image: redis:7-alpine
    container_name: polymetric-redis
    restart: always
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis_pass}
    volumes:
      - redis_data:/data
    networks:
      - polymetric-network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Django 后端应用
  backend:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.backend
    container_name: polymetric-backend
    restart: always
    command: >
      sh -c "
      python manage.py migrate &&
      python manage.py collectstatic --noinput &&
      gunicorn PolyMetric.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120
      "
    environment:
      - DEBUG=False
      - SECRET_KEY=${SECRET_KEY}
      - DB_ENGINE=django.db.backends.postgresql
      - DB_NAME=${DB_NAME:-polymetric}
      - DB_USER=${DB_USER:-polymetric_user}
      - DB_PASSWORD=${DB_PASSWORD:-polymetric_pass}
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-redis_pass}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost}
    volumes:
      - media_files:/app/media
      - static_files:/app/staticfiles
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - polymetric-network

  # Celery Worker
  celery-worker:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.backend
    container_name: polymetric-celery-worker
    restart: always
    command: celery -A PolyMetric worker --loglevel=info -P threads -c 50
    environment:
      - DEBUG=False
      - SECRET_KEY=${SECRET_KEY}
      - DB_ENGINE=django.db.backends.postgresql
      - DB_NAME=${DB_NAME:-polymetric}
      - DB_USER=${DB_USER:-polymetric_user}
      - DB_PASSWORD=${DB_PASSWORD:-polymetric_pass}
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-redis_pass}
    volumes:
      - media_files:/app/media
    depends_on:
      - backend
      - redis
    networks:
      - polymetric-network

  # Vue 前端应用
  frontend:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.frontend
      args:
        VITE_API_BASE_URL: "http://${SERVER_IP:-localhost}:${HTTP_PORT:-80}"
    container_name: polymetric-frontend
    restart: always
    expose:
      - "80"
    depends_on:
      - backend
    networks:
      - polymetric-network

  # Nginx 统一入口（反向代理）
  nginx:
    image: nginx:alpine
    container_name: polymetric-nginx
    restart: always
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ../nginx/unified.conf:/etc/nginx/conf.d/default.conf:ro
      - static_files:/usr/share/nginx/html/static:ro
      - media_files:/usr/share/nginx/html/media:ro
    depends_on:
      - backend
      - frontend
    networks:
      - polymetric-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  media_files:
    driver: local
  static_files:
    driver: local

networks:
  polymetric-network:
    driver: bridge
